name: Validar y fusionar PR - Demo

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número del Pull Request"
        required: true
        type: number

      ejecutar_merge:
        description: "Ejecutar merge real"
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  checks: read

env:
  # true  = simula acciones correctas
  # false = simula fallo
  ACCIONES_OK: "true"

jobs:
  premerge:
    name: Premerge Demo
    runs-on: ubuntu-latest

    steps:
      - name: Obtener información del PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          PR_DATA=$(gh api \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER")

          STATE=$(echo "$PR_DATA" | jq -r '.state')
          DRAFT=$(echo "$PR_DATA" | jq -r '.draft')
          BASE=$(echo "$PR_DATA" | jq -r '.base.ref')
          HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')

          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          echo "Estado: $STATE"
          echo "Draft: $DRAFT"
          echo "Destino: $BASE"
          echo "SHA: $HEAD_SHA"

      - name: Validar PR
        env:
          STATE: ${{ steps.pr.outputs.state }}
          DRAFT: ${{ steps.pr.outputs.draft }}
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          if [ "$STATE" != "open" ]; then
            echo "::error::El PR no está abierto"
            exit 1
          fi

          if [ "$DRAFT" = "true" ]; then
            echo "::error::El PR es un draft"
            exit 1
          fi

          if [ "$BASE" != "master" ]; then
            echo "::error::El PR debe tener master como destino"
            exit 1
          fi

          echo "PR válido"

      - name: Comprobar Quality Gate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          CONCLUSION=$(gh api \
            "repos/${{ github.repository }}/commits/$HEAD_SHA/check-runs" \
            --jq '
              [.check_runs[]
                | select(.name == "SonarQube Quality Gate")]
              | sort_by(.started_at)
              | last
              | .conclusion
            ')

          echo "Quality Gate: $CONCLUSION"

          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Quality Gate no superado"
            exit 1
          fi

          echo "Quality Gate correcto"

      - name: Simular acciones previas al merge
        run: |
          echo "Simulando acciones previas al merge..."
          sleep 2

          if [ "$ACCIONES_OK" != "true" ]; then
            echo "::error::Las acciones previas han fallado"
            exit 1
          fi

          echo "Acciones previas completadas"

      - name: Comprobar que el PR no ha cambiado
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          ORIGINAL_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          CURRENT_SHA=$(gh api \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER" \
            --jq '.head.sha')

          echo "SHA inicial: $ORIGINAL_SHA"
          echo "SHA actual:  $CURRENT_SHA"

          if [ "$CURRENT_SHA" != "$ORIGINAL_SHA" ]; then
            echo "::error::El PR ha cambiado durante la ejecución"
            exit 1
          fi

          echo "El PR sigue siendo el mismo"

      - name: Validación completada
        if: ${{ !inputs.ejecutar_merge }}
        run: |
          echo "=============================="
          echo "TODO CORRECTO"
          echo "=============================="
          echo "Quality Gate: OK"
          echo "Acciones previas: OK"
          echo "PR sin cambios: OK"
          echo "Merge real: DESACTIVADO"

      - name: Fusionar PR
        if: ${{ inputs.ejecutar_merge }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EXPECTED_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          gh api \
            --method PUT \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER/merge" \
            -f merge_method="merge" \
            -f sha="$EXPECTED_SHA"
